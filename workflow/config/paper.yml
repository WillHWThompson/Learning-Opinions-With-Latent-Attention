# The canonical sweep: every model the paper fits to the empirical panels. Each panel is fitted
# by every kernel it lists, under four noise models (Gaussian or Laplace, with or without the
# mover gate) and in each representation arm it lists; random features run over the panel's
# bandwidth grid. Expanded by kernel_inference/sweep.py.
defaults:
  cv_fold_index: [0, 1, 2, 3, 4]
  cv_num_folds: 5
  ll_stop_patience: 10
  ll_stopping_criterion: 1.0e-06
  lmbda_min: 0.001
variants:
  gaussian_nogate:
    noise_model: gaussian
  laplace_nogate:
    noise_model: laplace
  gaussian_gate:
    noise_model: gaussian
    b_null_min: 1.0e-05
    decoupled_scale: true
    infer_mu_null: true
    infer_pi: true
    init_pi: 0.5
  laplace_gate:
    noise_model: laplace
    b_null_min: 1.0e-05
    decoupled_scale: true
    infer_mu_null: true
    infer_pi: true
    init_pi: 0.5
arms:
  pairwise:
    representation: pairwise
  meanfield:
    representation: neighbour_mean_field
kernels:
  bc:
    kernel_func: bounded_confidence
    bisection_max_iter: 500
    optimization_method: bisection
  sbc:
    kernel_func: sigmoidal_bounded_confidence
    gd_rate: 0.01
    max_gd_iter: 100
  degroot:
    kernel_func: simplified_degroot
    degroot_unit_gain: true
    gd_rate: 0.01
    max_gd_iter: 100
    phi_init: [[1.0]]
  rzb:
    kernel_func: rzb
    gd_rate: 0.01
    kernel_phi_floor: 0.001
    kernel_positive_phi_transform: true
    max_gd_iter: 20
  'null':
    kernel_func: 'null'
    gd_rate: 0.01
    max_gd_iter: 100
    phi_init: [[0.0]]
  legendre:
    kernel_func: legendre
    bisection_max_iter: 500
    legendre_unit_gain_at_zero: true
    optimization_method: closed_form
    phi_init: [[0.5]]
  rff:
    kernel_func: random_fourier
    rff_seed: [0, 1, 2, 3]
    optimization_method: closed_form
    phi_init: [[0.5]]
    rff_unit_gain_at_zero: true
panels:
